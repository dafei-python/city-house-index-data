name: 成交量（日更）

# GitHub 的 cron 一律按 UTC 计算，下面是换算后的北京时间：
#   20 0 * * *  → 08:20 北京时间（主跑：北京/广州当天已给出前一日的日结）
#   20 5 * * *  → 13:20 北京时间（补跑：GitHub 调度器 best-effort，漏跑时兜底；
#                 苏州/南京/杭州/青岛是「当日累计」，这一班数值比早班更全）
#   40 14 * * * → 22:40 北京时间（晚班：当日累计接近日终值，当晚即可看到较完整数据）
#
# 只跑日更城市：北京、青岛、苏州、南京、杭州、广州。
# 西安（二手房网签）与武汉（新建商品房成交）官方只发月报，由 update-deals-monthly.yml 负责，
# 不进日更，避免每天报「解析失败」。日更不会冲掉已有月报数据。
#
# 一个 workflow 里的多条 cron 会触发「全部 job」，所以日更与月更必须拆成两个文件。
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 5 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch: # 网页上手动 Run workflow

permissions:
  contents: write

# 同一 workflow 不并发：后一次排队，避免两次抓到同一份数据互相覆盖
concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update-deals:
    name: 抓取 6 城官方网签（日更）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install beautifulsoup4 lxml

      - name: 抓取各城市官方网签
        # 8 城全部抓取失败时脚本会以非 0 退出，且不覆盖仓库里已有的 deals.json
        run: python3 data-pipeline/scrape_deals.py

      - name: 重建 manifest（含今天的运行心跳）
        run: python3 data-pipeline/publish_data.py --in-place --data-dir data --run-kind deals

      - name: 有变化才提交（只有心跳变化时记为心跳提交）
        run: |
          if git diff --quiet -- data; then
            echo "数据无变化，且今天已经记录过心跳，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/deals.json; then
            MSG="chore(data): 成交量运行心跳 $(date -u +%F)"
          else
            MSG="data(deals): 成交量 $(date -u +%F)"
          fi
          git add data
          git commit -m "$MSG"
          git push

      - name: 运行摘要
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.loads(pathlib.Path("data/manifest.json").read_text(encoding="utf-8"))
          print("| 项目 | 值 |")
          print("| --- | --- |")
          print(f"| 最近运行 | {m.get('last_run_at')}（{m.get('last_run_kind')}） |")
          print(f"| 成交量数据日期 | {m.get('deals_latest')} |")
          print(f"| 房价指数月份 | {m.get('latest_month')} |")
          print(f"| data_version | {m.get('data_version')} |")
          PY
