name: 更新数据（房价指数 · 月更 / 成交量 · 日更）

# 一个文件、两个独立 job：
#   · update-index：每天跑一次「检查」，只在北京时间 15–19 日窗口内、且本地还没有新月份时才真的抓取并提交；
#   · update-deals：每天真抓一次各城市官方网签数据。
# 两个 job 互相独立：一个失败不会影响另一个，失败日志也各自独立（Actions 里分开点开看）。
on:
  schedule:
    # 指数检查：每天 02:40 UTC = 北京时间 10:40
    - cron: "40 2 * * *"
    # 成交量：每天 01:20 UTC = 北京时间 09:20
    - cron: "20 1 * * *"
  workflow_dispatch: # 支持在网页上手动点 Run workflow

permissions:
  contents: write

jobs:
  update-index:
    name: 房价指数（月更 · 15–19 日窗口）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 判断今天是否可能有新月份
        id: gate
        run: |
          if python3 data-pipeline/should_update_index.py --data-dir data; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖
        if: steps.gate.outputs.run == '1'
        run: pip install beautifulsoup4 lxml

      - name: 抓取最新一期（已存在则跳过）
        if: steps.gate.outputs.run == '1'
        run: python3 data-pipeline/scrape_70cities.py --months 1 --out data --skip-existing

      - name: 重建 manifest（版本号 + sha256）
        if: steps.gate.outputs.run == '1'
        run: python3 data-pipeline/publish_data.py --in-place --data-dir data

      - name: 有变化才提交
        if: steps.gate.outputs.run == '1'
        run: |
          if git diff --quiet -- data; then
            echo "本月指数未更新，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LATEST=$(python3 -c "import json;print(json.load(open('data/manifest.json'))['latest_month'])")
          git add data
          git commit -m "data(index): ${LATEST}"
          git push

      - name: 跳过说明
        if: steps.gate.outputs.run == '0'
        run: echo "今天不在发布窗口内，或本地已是最新月份，未做任何下载与提交。"

  update-deals:
    name: 成交量（日更）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install beautifulsoup4 lxml

      - name: 抓取各城市官方网签数据
        run: python3 data-pipeline/scrape_deals.py

      - name: 重建 manifest（版本号 + sha256）
        run: python3 data-pipeline/publish_data.py --in-place --data-dir data

      - name: 有变化才提交
        run: |
          if git diff --quiet -- data; then
            echo "成交量数据与昨天一致，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data(deals): $(date -u +%Y-%m-%d)"
          git push
