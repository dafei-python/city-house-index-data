name: 更新房价指数（月更 · 15–19 日）

# 每天跑一次「检查」，但只有当统计局可能发布新月份时才真的抓取并提交。
# 统计局每月 15–19 日发布上月数据；其余时间本 workflow 会在第一步直接退出。
on:
  schedule:
    # 每天 02:10 UTC = 北京时间 10:10
    - cron: "10 2 * * *"
  workflow_dispatch: # 支持网页手动触发

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 判断今天是否可能有新月份
        id: gate
        run: |
          if python3 data-pipeline/should_update_index.py --data-dir data; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖
        if: steps.gate.outputs.run == '1'
        run: pip install beautifulsoup4 lxml

      - name: 抓取最新一期（已存在则跳过）
        if: steps.gate.outputs.run == '1'
        run: python3 data-pipeline/scrape_70cities.py --months 1 --out data --skip-existing

      - name: 重建 manifest（版本号 + sha256）
        if: steps.gate.outputs.run == '1'
        run: python3 data-pipeline/publish_data.py --in-place --data-dir data

      - name: 有变化才提交
        if: steps.gate.outputs.run == '1'
        run: |
          if git diff --quiet -- data; then
            echo "本月指数未更新，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LATEST=$(python3 -c "import json;print(json.load(open('data/manifest.json'))['latest_month'])")
          git add data
          git commit -m "data(index): ${LATEST}"
          git push

      - name: 跳过说明
        if: steps.gate.outputs.run == '0'
        run: echo "今天不在发布窗口内，或本地已是最新月份，未做任何下载与提交。"
